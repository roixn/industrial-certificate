version: '3.8'

services:
  web:
    build: .
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/industrial_training_certs
      - USE_MEMORY_DB=false
      - JWT_SECRET=industrial_cert_production_secret_key_2026
      - COOKIE_SECRET=industrial_cert_cookie_production_key_2026
      - CLIENT_URL=http://localhost:5001
      - PUBLIC_VERIFY_BASE_URL=http://localhost:5001/credentials
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
