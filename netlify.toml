[build]
  command = "npm run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# API requests route to the Express Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Client-side SPA routing (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
